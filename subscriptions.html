<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subscriptions - Budget Planner</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <script src="auth.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-content">
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1>Subscriptions</h1>
                <div class="user-greeting">Recurring</div>
            </div>

            <!-- Stats -->
            <div class="dashboard-grid">
                <div class="stat-card" style="border-color: rgba(99, 102, 241, 0.2);">
                    <div class="stat-label">Monthly Cost</div>
                    <div class="stat-value" id="total-monthly">₹0</div>
                </div>
                <div class="stat-card" style="border-color: rgba(236, 72, 153, 0.2);">
                    <div class="stat-label">Yearly Cost</div>
                    <div class="stat-value" id="total-yearly">₹0</div>
                </div>
            </div>
        </header>

        <!-- Subscription List -->
        <div class="grocery-section">
            <div class="section-header">
                <h2>Active Subscriptions</h2>
            </div>
            <div id="subscription-list" class="transaction-list">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <!-- FAB -->
    <button class="fab" id="add-sub-btn">
        <i class="fas fa-plus"></i>
    </button>

    <!-- Modal -->
    <div class="modal-overlay" id="sub-modal">
        <div class="modal" style="max-width: 400px; padding: 2rem;">
            <div class="modal-header" style="justify-content: center; margin-bottom: 2rem; position: relative;">
                <h3 id="modal-title" style="font-size: 1.5rem;">Add Subscription</h3>
                <button class="close-modal" id="close-modal"
                    style="position: absolute; right: 0; background: rgba(255,255,255,0.1); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;"><i
                        class="fas fa-times"></i></button>
            </div>

            <div class="modal-body" style="display: flex; flex-direction: column; gap: 1.25rem;">

                <!-- Service Name with Logo Preview Support (Future) -->
                <div class="form-group">
                    <label
                        style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">Service
                        Name</label>
                    <input type="text" id="sub-name" placeholder="Netflix, Hotstar, Zomato..."
                        style="width: 100%; padding: 1rem; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: 12px; color: white; font-size: 1rem;">
                </div>

                <!-- Cost Input styled big -->
                <div class="form-group">
                    <label
                        style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">Monthly/Yearly
                        Cost</label>
                    <div class="amount-input" style="position: relative;">
                        <span
                            style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); font-size: 1.2rem; color: var(--text-secondary);">₹</span>
                        <input type="number" id="sub-cost" placeholder="0"
                            style="width: 100%; padding: 1rem 1rem 1rem 2.5rem; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: 12px; color: white; font-size: 1.2rem; font-weight: 600;">
                    </div>
                </div>

                <!-- Cycle Chips -->
                <div class="form-group">
                    <label
                        style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">Billing
                        Cycle</label>
                    <div style="display: flex; gap: 0.75rem;">
                        <button class="chip active" data-value="monthly"
                            style="flex: 1; padding: 0.75rem; border-radius: 10px; border: 1px solid var(--primary); background: rgba(236, 72, 153, 0.2); color: white; cursor: pointer;">Monthly</button>
                        <button class="chip" data-value="yearly"
                            style="flex: 1; padding: 0.75rem; border-radius: 10px; border: 1px solid var(--glass-border); background: transparent; color: var(--text-secondary); cursor: pointer;">Yearly</button>
                    </div>
                </div>

                <div style="display: flex; gap: 1rem;">
                    <!-- Due Date -->
                    <div class="form-group" style="flex: 1;">
                        <label
                            style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">Due
                            Date</label>
                        <input type="number" id="sub-date" min="1" max="31" placeholder="Day (1-31)"
                            style="width: 100%; padding: 1rem; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: 12px; color: white; font-size: 1rem;">
                    </div>

                    <!-- Category/Type -->
                    <div class="form-group" style="flex: 1;">
                        <label
                            style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">Category</label>
                        <select id="sub-category"
                            style="width: 100%; padding: 1rem; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: 12px; color: white; font-size: 1rem; appearance: none;">
                            <option value="Entertainment">Entertainment</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Food">Food & Dining</option>
                            <option value="Software">Software</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
            </div>

            <button class="btn-primary" id="save-sub-btn"
                style="width: 100%; margin-top: 2rem; padding: 1rem; font-size: 1.1rem; border-radius: 12px; background: linear-gradient(135deg, var(--primary), #db2777); border: none; color: white; font-weight: 600; cursor: pointer; box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);">
                Save Subscription
            </button>
        </div>
    </div>

    <script src="subscriptions.js"></script>
</body>

</html>
