<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subscriptions - Budget Planner</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="subscriptions.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <script src="auth.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-content">
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1>Subscriptions</h1>
                <div class="user-greeting">Recurring</div>
            </div>

            <!-- Stats -->
            <div class="dashboard-grid">
                <div class="stat-card" style="border-color: rgba(99, 102, 241, 0.2);">
                    <div class="stat-label">Monthly Cost</div>
                    <div class="stat-value" id="total-monthly">₹0</div>
                </div>
                <div class="stat-card" style="border-color: rgba(236, 72, 153, 0.2);">
                    <div class="stat-label">Yearly Cost</div>
                    <div class="stat-value" id="total-yearly">₹0</div>
                </div>
            </div>
        </header>

        <!-- Subscription List -->
        <div class="grocery-section">
            <div class="section-header">
                <h2>Active Subscriptions</h2>
            </div>
            <div id="subscription-list" class="transaction-list">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <!-- FAB -->
    <button class="fab" id="add-sub-btn">
        <i class="fas fa-plus"></i>
    </button>

    <!-- Modal -->
    <div class="modal-overlay" id="sub-modal">
        <div class="subscription-modal">
            <div class="modal-header">
                <h3>Add Subscription</h3>
                <button class="close-modal" id="close-modal"><i class="fas fa-times"></i></button>
            </div>

            <div class="modal-body form-grid">

                <!-- Service Name -->
                <div class="input-group">
                    <label class="input-label">Service Name</label>
                    <input type="text" id="sub-name" class="premium-input" placeholder="Netflix, Hotstar, Zomato...">
                </div>

                <!-- Cost Input -->
                <div class="input-group">
                    <label class="input-label">Monthly/Yearly Cost</label>
                    <div class="cost-wrapper">
                        <span class="currency-symbol">₹</span>
                        <input type="number" id="sub-cost" class="premium-input has-currency" placeholder="0">
                    </div>
                </div>

                <!-- Cycle Switcher -->
                <div class="input-group">
                    <label class="input-label">Billing Cycle</label>
                    <div class="cycle-switcher">
                        <button class="cycle-btn active" data-value="monthly">Monthly</button>
                        <button class="cycle-btn" data-value="yearly">Yearly</button>
                    </div>
                </div>

                <!-- Row -->
                <div class="form-row">
                    <div class="input-group">
                        <label class="input-label">Due Date</label>
                        <input type="number" id="sub-date" class="premium-input" min="1" max="31"
                            placeholder="Day (1-31)">
                    </div>

                    <!-- Custom Category Dropdown -->
                    <div class="input-group" style="flex: 1; position: relative;">
                        <label class="input-label">Category</label>
                        <div id="custom-category-select" class="premium-input"
                            style="cursor: pointer; display: flex; align-items: center; justify-content: space-between;">
                            <span id="selected-category-text">Entertainment</span>
                            <i class="fas fa-chevron-down" style="font-size: 0.8rem; color: var(--text-secondary);"></i>
                        </div>
                        <!-- Hidden Input -->
                        <input type="hidden" id="sub-category" value="Entertainment">

                        <!-- Dropdown Menu -->
                        <div id="category-options"
                            style="position: absolute; top: 110%; left: 0; width: 100%; background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; z-index: 100; display: none; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
                            <div class="cat-option" data-value="Entertainment"
                                style="padding: 0.75rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; color: white;">
                                Entertainment</div>
                            <div class="cat-option" data-value="Utilities"
                                style="padding: 0.75rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; color: white;">
                                Utilities</div>
                            <div class="cat-option" data-value="Shopping"
                                style="padding: 0.75rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; color: white;">
                                Shopping</div>
                            <div class="cat-option" data-value="Food"
                                style="padding: 0.75rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; color: white;">
                                Food & Dining</div>
                            <div class="cat-option" data-value="Software"
                                style="padding: 0.75rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; color: white;">
                                Software</div>
                            <div class="cat-option" data-value="Other"
                                style="padding: 0.75rem 1rem; cursor: pointer; color: white;">Other</div>
                        </div>
                    </div>
                </div>
            </div>

            <button class="btn-save" id="save-sub-btn">
                Save Subscription
            </button>
        </div>
    </div>

    <script src="subscriptions.js"></script>
</body>

</html>
